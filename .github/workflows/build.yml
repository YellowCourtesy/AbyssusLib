name: Build

# Only by hand (Actions tab, "Run workflow"): a build starts only when the
# user asks for it. A push does not start a build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $b = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout $b
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-cache" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      # Rule: build with the compiler of the newest CommonLibSSE prebuilt, so that
      # the prebuilt is used (a different compiler version makes CommonLibSSE
      # build itself from source, which takes much longer). The prebuilt of the
      # CommonLibSSE release in lib/commonlibsse-ng has the version of its
      # compiler in TOOLSET_VERSION.txt (cl 19.NN is toolset 14.NN). If that
      # toolset is not on the build machine, the default compiler is used and
      # CommonLibSSE builds from source.
      - name: Find the compiler of the CommonLibSSE prebuilt
        id: toolset
        shell: pwsh
        run: |
          git -C lib/commonlibsse-ng fetch --tags --depth=1 origin 2>$null
          $tag = git -C lib/commonlibsse-ng describe --tags --exact-match 2>$null
          if (-not $tag) { Write-Warning "lib/commonlibsse-ng is not at a release tag: no prebuilt, the default compiler is used."; exit 0 }
          $url = "https://github.com/alandtse/CommonLibSSE-NG/releases/download/$tag/commonlibsse-ng-prebuilt-$tag-all-msvc-cmake.zip"
          $zip = "$env:RUNNER_TEMP/commonlib-prebuilt.zip"
          try { Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip } catch {
            Write-Warning "The CommonLibSSE prebuilt of $tag could not be downloaded: the default compiler is used."; exit 0 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entry = $archive.Entries | Where-Object { $_.FullName -match '(^|/)TOOLSET_VERSION\.txt$' } | Select-Object -First 1
          if (-not $entry) { $archive.Dispose(); Write-Warning "The prebuilt of $tag has no TOOLSET_VERSION.txt: the default compiler is used."; exit 0 }
          $reader = New-Object System.IO.StreamReader($entry.Open())
          $version = $reader.ReadToEnd().Trim()
          $reader.Close()
          $archive.Dispose()
          if ($version -notmatch '^19\.(\d+)') { Write-Warning "Unknown compiler version '$version' in the prebuilt: the default compiler is used."; exit 0 }
          $toolset = "14.$($Matches[1])"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $installed = @(Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object Name)
          if ($installed | Where-Object { $_ -like "$toolset.*" }) {
            "toolset=$toolset" >> $env:GITHUB_OUTPUT
            Write-Host "CommonLibSSE $tag prebuilt: compiler $version, toolset $toolset is used."
          } else {
            Write-Warning "CommonLibSSE $tag prebuilt needs toolset $toolset (compiler $version). The build machine has: $($installed -join ', '). The default compiler is used, and CommonLibSSE builds from source."
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.toolset.outputs.toolset }}

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build --target AbyssusLib

      # The mod folder: its root is the game's Data folder (ready for MO2 and Vortex).
      - name: Stage mod files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/SKSE/Plugins | Out-Null
          Copy-Item build/AbyssusLib.dll package/SKSE/Plugins/

      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: AbyssusLib
          path: package/
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: AbyssusLib-pdb
          path: build/AbyssusLib.pdb
          if-no-files-found: warn
