; AbyssusLib settings.
; Config version: @VERSION@
; Do not change the line above. AbyssusLib makes this file on the first launch.
; A new version adds its new settings to this file with their default values,
; and changes that line. Your values, comments and order stay. Delete this
; file to restore all default values.
;
; This file at the top level of the AbyssusLib repository is the default
; text: the build puts it into AbyssusLib.dll.

[Keys]
; Key that cycles the configurations. Windows virtual key code: 0x7A = F11.
iCycleKey = 0x7A

[Stack]
; Configuration at the game start: its number in the [Configurations] list (1 = the first).
iStartConfig = 1
; Seconds that the name of a new configuration shows at the top center (0 = never).
fLabelSeconds = 3

; One line for each configuration, in the order of the cycle:
;   name = the groups that show, separated by commas
; Groups: the names in [Groups] (or that a plugin tells), Others (all plugins
; with a group that no configuration names), Notif (the notification queue).
; Nothing after "=": nothing shows.
; An update never adds lines here: a configuration that you removed stays removed.
[Configurations]
Diag / GPS / Notif = Diag, GPS, Others, Notif
GPS / Notif = GPS, Others, Notif
GPS = GPS
Notif = Others, Notif
Off =

; The group of each plugin, for [Configurations]: plugin name = group.
; A plugin can also tell its group itself; a line here wins.
; An update never adds lines here.
[Groups]
SkyrimDiagnostics = Diag
SkyrimDiagnostics Warnings = Diag
SkyGPS = GPS

; The place of each plugin in the stack: plugin name = number, low = top.
; A plugin can also tell its place itself; a line here wins. A plugin with no
; place: 1000, in the order of its first window. The notification queue is
; always at the bottom.
; An update never adds lines here.
[Order]
SkyrimDiagnostics = 100
SkyGPS = 200
SkyrimDiagnostics Warnings = 5000
