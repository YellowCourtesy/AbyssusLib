; AbyssusLib settings.
; Config version: @VERSION@
; Do not change the line above. AbyssusLib makes this file on the first launch.
; A new version adds its new settings to this file with their default values,
; and changes that line. Your values, comments and order stay. Delete this
; file to restore all default values.
;
; This file at the top level of the AbyssusLib repository is the default
; text: the build puts it into AbyssusLib.dll.

[Keys]
; Key that cycles the configurations. Windows virtual key code: 0x7A = F11.
iCycleKey = 0x7A

[Stack]
; Configuration at the game start: its number in the [Configurations] list (1 = the first).
iStartConfig = 1
; Seconds that the name of a new configuration shows at the top center (0 = never).
fLabelSeconds = 3

; One line for each configuration, in the order of the cycle:
;   name = the parts that show, separated by commas
; Parts: Diag (SkyrimDiagnostics), GPS (SkyGPS), Others (all other plugins),
; Notif (the notification queue). Nothing after "=": nothing shows.
; An update never adds lines here: a configuration that you removed stays removed.
[Configurations]
Diag / GPS / Notif = Diag, GPS, Others, Notif
GPS / Notif = GPS, Others, Notif
GPS = GPS
Notif = Others, Notif
Off =
